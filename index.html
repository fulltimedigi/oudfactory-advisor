    --gold:#c8a84b;
    --gold-dark:#9a7a25;
    --gold-light:#e2c97e;
    --bg:#0a0a0a;
    --card:#141414;
    --card2:#1c1c1c;

  html,body{max-width:100%;overflow-x:hidden;scroll-behavior:smooth}
  body{
    font-family:'Jost',sans-serif;
    background:var(--bg);
    color:var(--ink);

    font-size:15px;

  body.lang-ar .hero-eyebrow,
  body.lang-ar .q-step,

  body.lang-ar .opt{text-align:right;flex-direction:row-reverse}
  body.lang-ar .back-row{text-align:center}
  body.lang-ar .tp-because{border-left:none;border-right:2px solid var(--gold);padding-left:0;padding-right:16px}
  body.lang-ar .prod-card-head{flex-direction:row-reverse}

  body.lang-ar .breadcrumb{text-align:right}
  body.lang-ar .site-footer{direction:rtl}
  body.lang-ar .tp-price-row{flex-direction:row-reverse}
  body.lang-ar .tp-tags{justify-content:flex-end}
  body.lang-ar .prod-card-tags{justify-content:flex-end}

  /* HEADER */
  .site-header{
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:0 24px;
    display:flex;align-items:center;justify-content:space-between;

  .site-header-logo{display:flex;align-items:center;gap:12px}
  .site-header img{height:36px;width:auto}

  /* LANGUAGE TOGGLE */
  .lang-btn{
    appearance:none;border:1px solid var(--border);background:transparent;
    color:var(--muted);cursor:pointer;
    font-family:'Jost',sans-serif;font-size:11px;font-weight:500;
    letter-spacing:1.5px;text-transform:uppercase;
    padding:7px 14px;
    transition:border-color .15s,color .15s;
    white-space:nowrap;flex-shrink:0;
  }
  .lang-btn:hover{border-color:var(--gold);color:var(--gold)}
  .lang-btn .active-lang{color:var(--gold);font-weight:600}

  /* BREADCRUMB */
  .breadcrumb{

  }
  .breadcrumb a{color:var(--muted);text-decoration:none}
  .breadcrumb span{color:var(--gold)}
  body.lang-ar .breadcrumb{letter-spacing:0}

  /* MAIN */
  .wrap{max-width:640px;margin:0 auto;padding:0 20px 56px}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:2px;

  .progress > i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s ease}

  .q-text{

  .opt{

  .msg.ok{display:block;background:rgba(76,175,130,.1);color:var(--ok);border:1px solid rgba(76,175,130,.3)}

    font-size:11px;color:var(--muted2);margin-top:56px;

  .swipe-counter{text-align:center;font-size:11px;color:var(--muted2);margin-top:8px}
</style>

<script>
/* ===== LEAD COLLECTION — paste your Google Apps Script Web App URL below ===== */
const LEAD_ENDPOINT = ""; // e.g. "https://script.google.com/macros/s/YOUR_ID/exec"

/* ===== SHOPIFY STOREFRONT API ===== */
const SHOPIFY_DOMAIN   = "oud-factory.myshopify.com";
const SHOPIFY_TOKEN    = "34f268d0dff3b46e9f6246ccfd1d3e24";
const SHOPIFY_API_VER  = "2024-01";

async function fetchShopifyPrices() {
  /* Build a handles-to-id map: Shopify handle → P key */
  const handleMap = {};
  Object.entries(P).forEach(([key, p]) => {
    const handle = p.url.split("/products/")[1];
    if (handle) handleMap[handle] = key;
  });

  const handles = Object.keys(handleMap);

  /* GraphQL — fetch all products in one request using productByHandle */
  /* Aliases must not start with a digit — prefix with "p_" */
  const toAlias = h => "p_" + h.replace(/-/g, "_");

  const queries = handles.map(h =>
    `${toAlias(h)}: productByHandle(handle: "${h}") { priceRange { minVariantPrice { amount } } compareAtPriceRange { maxVariantPrice { amount } } availableForSale }`
  ).join("\n");

  const body = JSON.stringify({ query: `{ ${queries} }` });

  try {
    const res = await fetch(
      `https://${SHOPIFY_DOMAIN}/api/${SHOPIFY_API_VER}/graphql.json`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Shopify-Storefront-Access-Token": SHOPIFY_TOKEN
        },
        body
      }
    );
    if (!res.ok) return;
    const json = await res.json();
    const data = json.data || {};

    handles.forEach(h => {
      const alias = toAlias(h);
      const prod  = data[alias];
      const key   = handleMap[h];
      if (!prod || !P[key]) return;

      const saleAmt = parseFloat(prod.priceRange?.minVariantPrice?.amount || 0);
      const wasAmt  = parseFloat(prod.compareAtPriceRange?.maxVariantPrice?.amount || 0);
      const avail   = prod.availableForSale;

      if (saleAmt > 0) P[key].sale = saleAmt.toFixed(2);
      if (wasAmt  > 0) P[key].was  = wasAmt.toFixed(2);
      P[key].available = avail;  /* true / false */
    });

    console.log("[Oud Factory] Shopify prices updated ✓");
  } catch(e) {
    console.warn("[Oud Factory] Shopify fetch failed — using defaults", e);
  }
}

      body: JSON.stringify({
        top: topProduct.n,
        score: topScore,
        answers: state.answers,
        lang: currentLang,

}

/* ===== LANGUAGE DETECTION & STATE ===== */
const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
let currentLang = browserLang.startsWith('ar') ? 'ar' : 'en';

function L(){ return LANG[currentLang]; }

function applyLang(){
  const html = document.getElementById('html-root');
  const body = document.body;
  const l = L();
  if(currentLang === 'ar'){
    html.setAttribute('lang','ar');
    html.setAttribute('dir','rtl');
    body.classList.add('lang-ar');
  } else {
    html.setAttribute('lang','en');
    html.setAttribute('dir','ltr');
    body.classList.remove('lang-ar');
  }
  // Update lang button label
  if(currentLang === 'ar'){
    document.getElementById('lang-label').innerHTML = '<span class="active-lang">AR</span> | EN';
  } else {
    document.getElementById('lang-label').innerHTML = 'EN | <span class="active-lang">AR</span>';
  }
  // Update breadcrumb
  document.getElementById('bread-home').textContent = l.breadHome;
  document.getElementById('bread-advisor').textContent = l.breadAdvisor;
  // Update footer
  document.getElementById('footer-built').textContent = l.footerBuilt;
  document.getElementById('footer-advisor').textContent = l.breadAdvisor;
  // Re-render current screen
  if(state.phase === 'hero') renderHero();
  else if(state.phase === 'question') renderQuestion();
  else if(state.phase === 'result') renderResult();
}

function toggleLang(){
  currentLang = currentLang === 'en' ? 'ar' : 'en';
  applyLang();
}

/* ===== SCORING ===== */
function scoreProduct(pid, a){
  const p = P[pid];
  let s = 0;

  /* q0 — product type filter (hard gate) */
  if(a.q0 === "perfume"){
    if(p.category === "Oud Oil") return -999;   // oils never shown when user picks perfume
  } else if(a.q0 === "oil"){
    if(p.category !== "Oud Oil") return -999;   // perfumes never shown when user picks oil
  }
  /* q0=both: no penalty/bonus */

  /* q1 — usage type */
  if(a.q1 === "home"){
    s += p.usage === "burn" ? 35 : 0;
  } else if(a.q1 === "gift"){
    s += (p.category === "Gift Set") ? 40 : (p.usage === "wear" ? 25 : 5);
  } else {
    s += p.usage === "wear" ? 35 : 0;
  }

  /* q4 — scent family (30pts max) */
  const fm = {
    warm:  {oud_pure:30,oud_leather:28,tobacco_smoky:26,oud_sweet:22,musk_animalic:20,oud_incense:20,oud_sweet_woody:16,floral_rose_oud:12,musky_floral:8,fresh_musky:4,floral_rose:4,oud_smoky_oriental:20,oud_smoky_incense:20,musky_white_floral:8},
    smoky: {tobacco_smoky:30,oud_leather:28,musk_animalic:24,oud_pure:18,oud_incense:16,oud_sweet:12,oud_sweet_woody:10,floral_rose_oud:6,musky_floral:4,fresh_musky:2,floral_rose:2,oud_smoky_oriental:28,oud_smoky_incense:24,musky_white_floral:4},
    fresh: {fresh_musky:30,musky_floral:18,floral_rose:14,oud_sweet_woody:10,oud_pure:6,oud_sweet:4,oud_leather:2,tobacco_smoky:2,musk_animalic:6,oud_incense:4,floral_rose_oud:10,oud_smoky_oriental:2,oud_smoky_incense:4,musky_white_floral:18},
    floral:{floral_rose:30,floral_rose_oud:28,musky_floral:24,fresh_musky:14,oud_sweet:12,oud_pure:6,oud_leather:4,tobacco_smoky:2,musk_animalic:4,oud_incense:4,oud_sweet_woody:8,oud_smoky_oriental:4,oud_smoky_incense:4,musky_white_floral:23},
    sweet: {oud_sweet:30,musky_floral:26,floral_rose:18,oud_sweet_woody:26,fresh_musky:12,musk_animalic:16,oud_pure:10,oud_leather:6,tobacco_smoky:8,oud_incense:6,floral_rose_oud:14,oud_smoky_oriental:10,oud_smoky_incense:6,musky_white_floral:26}
  };
  s += ((fm[a.q4]||{})[p.family]||0);

  /* q3 — intensity (15pts) */
  const im = {strong:3,moderate:2,quiet:1};
  const diff = Math.abs(p.intensity-(im[a.q3]||2));
  s += diff===0?15:diff===1?8:2;

  /* q2 — occasion (12pts) */
  const om = {daily:["daily","home"],events:["events","evening","gift"],both:["daily","events","home","gift","evening"]};
  s += (om[a.q2]||[]).some(o=>p.occasions.includes(o))?12:0;

  /* q6 — budget hard gate + soft scoring */
  const actualPrice = parseFloat(p.sale);
  if(a.q6 === "eco"  && actualPrice > 450)  return -999;  // over budget — never show
  if(a.q6 === "mid"  && actualPrice > 750)  return -999;  // over budget — never show
  if(a.q6 === "high" && actualPrice < 450)  s -= 4;       // under budget soft penalty only
  const effectiveTier = p.tier === "luxury" ? "high" : p.tier;
  const bm = {eco:{eco:8,mid:4,high:0},mid:{eco:4,mid:8,high:2},high:{eco:2,mid:4,high:8}};
  s += ((bm[a.q6]||{})[effectiveTier]||4);

  /* q5 — oud affinity (bonus) */
  if(a.q5==="lover" && (p.family==="oud_pure"||p.family==="oud_leather"||p.family==="oud_smoky_oriental"||p.family==="oud_smoky_incense"||p.family==="oud_incense")) s+=5;
  if(a.q5==="light" && (p.family==="fresh_musky"||p.family==="floral_rose")) s+=5;
  if(a.q5==="moderate" && (p.family==="oud_sweet"||p.family==="oud_sweet_woody")) s+=10;
  if(a.q5==="moderate" && (p.family==="musky_floral"||p.family==="musky_white_floral")) s+=16;
  if(a.q5==="oil" && p.category==="Oud Oil") s+=8;
  if(a.q5==="musk" && p.family==="musk_animalic") s+=10;

  return s;
}

function rankProducts(a){
  return Object.keys(P)
    .filter(id => P[id].available !== false)  /* hide out-of-stock products */
    .map(id=>({id,score:scoreProduct(id,a)}))
    .sort((a,b)=>b.score-a.score);
}

function matchReason(pid, a){
  const p = P[pid];
  const l = L();
  const r = [];
  if(a.q1==="home" && p.usage==="burn") r.push(l.matchReason_home);
  if(a.q1==="gift" && p.category==="Gift Set") r.push(l.matchReason_gift);
  if(a.q1!=="home" && p.usage==="wear" && a.q1!=="gift") r.push(l.matchReason_wear);
  const fl = l.families;
  if(fl[p.family]) r.push(fl[p.family]);
  const il = l.intensities;
  if(il[p.intensity]) r.push(il[p.intensity]);
  return r.slice(0,2).join(" · ");
}

/* ===== SWIPE LOGIC ===== */
let swipeData = []; // {productId, action: 'like'|'dislike', topResult}

function swipeAction(dir){
  const deck = document.getElementById('swipeDeck');
  if(!deck) return;
  const cards = [...deck.querySelectorAll('.swipe-card:not(.gone)')];
  if(!cards.length) return;
  const top = cards[cards.length-1];
  animateSwipe(top, dir);
}

function animateSwipe(card, dir){
  const x = dir === 'right' ? 400 : -400;
  card.style.transition = 'transform .35s ease, opacity .35s';
  card.style.transform = `translateX(${x}px) rotate(${dir==='right'?20:-20}deg)`;
  card.style.opacity = '0';
  // show overlay
  const overlay = card.querySelector(`.swipe-overlay.${dir==='right'?'like':'nope'}`);
  if(overlay) overlay.style.opacity = '1';
  // record
  const pid = card.dataset.id;
  const action = dir === 'right' ? 'like' : 'dislike';
  const topResult = state.ranked[0]?.id || '';
  swipeData.push({productId: pid, action, topResult});
  sendSwipeData(pid, action, topResult);
  setTimeout(()=>{
    card.classList.add('gone');
    updateSwipeCounter();
  }, 350);
}

function updateSwipeCounter(){
  const deck = document.getElementById('swipeDeck');
  const counter = document.getElementById('swipeCounter');
  const done = document.getElementById('swipeDone');
  if(!deck) return;
  const remaining = deck.querySelectorAll('.swipe-card:not(.gone)').length;
  if(counter) counter.textContent = remaining + (currentLang==='ar' ? ' منتج متبقي' : ' products remaining');
  if(remaining === 0){
    if(counter) counter.style.display = 'none';
    if(done) done.style.display = 'block';
    document.querySelectorAll('.swipe-btn').forEach(b=>b.style.display='none');
  }
}

function sendSwipeData(pid, action, topResult){
  if(!LEAD_ENDPOINT) return;
  const pd = P[pid];
  fetch(LEAD_ENDPOINT, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      type: 'swipe',
      product: pd ? pd.n : pid,
      productId: pid,
      action,
      topResult: P[topResult] ? P[topResult].n : topResult,
      timestamp: new Date().toISOString(),
      lang: currentLang
    })
  }).catch(()=>{});
}

// Touch/drag support for swipe cards
(function initSwipeTouch(){
  let startX, startY, isDragging = false, activeCard = null;

  function getTopCard(){
    const deck = document.getElementById('swipeDeck');
    if(!deck) return null;
    const cards = [...deck.querySelectorAll('.swipe-card:not(.gone)')];
    return cards[cards.length-1] || null;
  }

  document.addEventListener('mousedown', e=>{
    const card = e.target.closest('.swipe-card');
    if(!card) return;
    isDragging = true; activeCard = card;
    startX = e.clientX; startY = e.clientY;
    card.style.transition = 'none';
  });

  document.addEventListener('touchstart', e=>{
    const card = e.target.closest('.swipe-card');
    if(!card) return;
    isDragging = true; activeCard = card;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    card.style.transition = 'none';
  }, {passive:true});

  function onMove(x, y){
    if(!isDragging || !activeCard) return;
    const dx = x - startX;
    const rot = dx * 0.08;
    activeCard.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    const likeO = activeCard.querySelector('.swipe-overlay.like');
    const nopeO = activeCard.querySelector('.swipe-overlay.nope');
    if(likeO) likeO.style.opacity = dx > 30 ? Math.min((dx-30)/60,1) : 0;
    if(nopeO) nopeO.style.opacity = dx < -30 ? Math.min((-dx-30)/60,1) : 0;
  }

  document.addEventListener('mousemove', e=>{ if(isDragging) onMove(e.clientX, e.clientY); });
  document.addEventListener('touchmove', e=>{ if(isDragging) onMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});

  function onEnd(x){
    if(!isDragging || !activeCard) return;
    isDragging = false;
    const dx = x - startX;
    if(Math.abs(dx) > 80){
      animateSwipe(activeCard, dx > 0 ? 'right' : 'left');
    } else {
      activeCard.style.transition = 'transform .3s';
      activeCard.style.transform = '';
      activeCard.querySelectorAll('.swipe-overlay').forEach(o=>o.style.opacity=0);
    }
    activeCard = null;
  }

  document.addEventListener('mouseup', e=>onEnd(e.clientX));
  document.addEventListener('touchend', e=>onEnd(e.changedTouches[0].clientX));
})();

/* ===== INIT ===== */
state.phase = 'hero';
/* Fetch live Shopify prices then init — fall back immediately on error */
fetchShopifyPrices().finally(() => {
  applyLang(); // applyLang detects phase and calls renderHero()
});
</script>
