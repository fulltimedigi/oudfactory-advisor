<style>
  :root{
    --gold:#c8a84b;
    --gold-dark:#9a7a25;
    --gold-light:#e2c97e;
    --bg:#0a0a0a;
    --card:#141414;
    --card2:#1c1c1c;
    --border:#2a2a2a;
    --white:#f5f0e8;
    --muted:#888;
    --muted2:#555;
    --ok:#4caf82;
    --err:#c0392b;
    --ink:#e8e0d0;
  }

  html,body{max-width:100%;overflow-x:hidden;scroll-behavior:smooth}
  body{
    font-family:'Jost',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    font-size:15px;
    line-height:1.7;
  }
  body.lang-ar{
    font-family:'Tajawal',sans-serif;
    direction:rtl;
  }

  /* ARABIC FONT OVERRIDES */
  body.lang-ar h1,
  body.lang-ar .q-text,
  body.lang-ar .tp-name,
  body.lang-ar .result-header h2,
  body.lang-ar .form-title,
  body.lang-ar .prod-card-name{
    font-family:'Tajawal',sans-serif;
    font-weight:700;
  }
  body.lang-ar .hero-eyebrow,
  body.lang-ar .q-step,
  body.lang-ar .section-label,
  body.lang-ar .top-pick-label,
  body.lang-ar .tp-category,
  body.lang-ar .lang-btn{
    font-family:'Tajawal',sans-serif;
    letter-spacing:0;
  }
  body.lang-ar .opt{text-align:right;flex-direction:row-reverse}
  body.lang-ar .back-row{text-align:center}
  body.lang-ar .tp-because{border-left:none;border-right:2px solid var(--gold);padding-left:0;padding-right:16px}
  body.lang-ar .prod-card-head{flex-direction:row-reverse}
  body.lang-ar .prod-card-price .was{margin-left:0;margin-right:6px}
  body.lang-ar .breadcrumb{text-align:right}
  body.lang-ar .site-footer{direction:rtl}
  body.lang-ar .tp-price-row{flex-direction:row-reverse}
  body.lang-ar .tp-tags{justify-content:flex-end}
  body.lang-ar .prod-card-tags{justify-content:flex-end}

  /* HEADER */
  .site-header{
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:0 24px;
    display:flex;align-items:center;justify-content:space-between;
    height:60px;position:sticky;top:0;z-index:100;
  }
  .site-header-logo{display:flex;align-items:center;gap:12px}
  .site-header img{height:36px;width:auto}

  /* LANGUAGE TOGGLE */
  .lang-btn{
    appearance:none;border:1px solid var(--border);background:transparent;
    color:var(--muted);cursor:pointer;
    font-family:'Jost',sans-serif;font-size:11px;font-weight:500;
    letter-spacing:1.5px;text-transform:uppercase;
    padding:7px 14px;
    transition:border-color .15s,color .15s;
    white-space:nowrap;flex-shrink:0;
  }
  .lang-btn:hover{border-color:var(--gold);color:var(--gold)}
  .lang-btn .active-lang{color:var(--gold);font-weight:600}

  /* BREADCRUMB */
  .breadcrumb{
    padding:12px 24px;font-size:12px;color:var(--muted);
    max-width:640px;margin:0 auto;letter-spacing:.5px;
    text-transform:uppercase;
  }
  .breadcrumb a{color:var(--muted);text-decoration:none}
  .breadcrumb span{color:var(--gold)}
  body.lang-ar .breadcrumb{letter-spacing:0}

  /* MAIN */
  .wrap{max-width:640px;margin:0 auto;padding:0 20px 56px}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:2px;
    overflow:hidden;
  }
  .pad{padding:36px 32px}
  @media(max-width:480px){.pad{padding:28px 20px}}

  /* PROGRESS */
  .progress{height:2px;background:var(--border)}
  .progress > i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s ease}

  /* HERO */
  .hero-eyebrow{
    font-size:10px;font-weight:600;letter-spacing:3px;
    color:var(--gold);text-transform:uppercase;
    margin-bottom:20px;display:block;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-size:32px;font-weight:600;line-height:1.25;
    color:var(--white);margin-bottom:14px;
  }
  .sub{font-size:14px;color:var(--muted);margin-bottom:32px;line-height:1.8;font-weight:300}
  .divider{height:1px;background:var(--border);margin:28px 0}

  /* BUTTONS */
  .btn{
    appearance:none;border:0;cursor:pointer;
    font-family:'Jost',inherit;font-weight:500;font-size:13px;
    letter-spacing:1.5px;text-transform:uppercase;
    padding:14px 32px;width:100%;
    transition:all .2s ease;display:block;text-align:center;text-decoration:none;
  }
  body.lang-ar .btn{font-family:'Tajawal',sans-serif;letter-spacing:0;font-size:14px}
  .btn-primary{background:var(--gold);color:#0a0a0a}
  .btn-primary:hover{background:var(--gold-light)}
  .btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold)}
  .btn-outline:hover{background:rgba(200,168,75,.08)}
  .btn-ghost{
    background:transparent;color:var(--muted);
    border:1px solid var(--border);font-size:12px;
    padding:11px 28px;letter-spacing:1px;
  }
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

  /* QUESTION */
  .q-step{font-size:11px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
  .q-text{
    font-family:'Cormorant Garamond',serif;
    font-size:24px;font-weight:600;color:var(--white);
    margin-bottom:28px;line-height:1.35;
  }
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{
    background:var(--card2);border:1px solid var(--border);
    padding:16px 20px;cursor:pointer;
    font-family:'Jost',inherit;font-size:14px;color:var(--ink);
    transition:border-color .15s,background .15s;
    display:flex;align-items:center;gap:14px;
    text-align:left;
  }
  body.lang-ar .opt{font-family:'Tajawal',sans-serif;font-size:15px}
  .opt:hover{border-color:var(--gold);background:rgba(200,168,75,.05)}
  .opt .dot{
    width:16px;height:16px;border-radius:50%;
    border:1px solid var(--muted2);flex:0 0 auto;
    transition:border-color .15s,background .15s;
  }
  .opt:hover .dot{border-color:var(--gold)}
  .back-row{margin-top:14px;text-align:center}

  /* RESULT HEADER */
  .result-header{margin-bottom:32px}
  .result-header h2{
    font-family:'Cormorant Garamond',serif;
    font-size:26px;font-weight:600;color:var(--white);
    margin-bottom:8px;line-height:1.3;
  }
  .result-header p{font-size:13px;color:var(--muted);line-height:1.8}
  body.lang-ar .result-header p{font-size:14px}

  /* TOP PICK */
  .top-pick{
    background:var(--card2);
    border:1px solid var(--gold);
    margin-bottom:16px;overflow:hidden;
  }
  .top-pick-label{
    background:var(--gold);color:#0a0a0a;
    font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
    padding:7px 20px;display:block;text-align:center;
  }
  .top-pick-body{padding:28px 28px 24px}
  .tp-name{
    font-family:'Cormorant Garamond',serif;
    font-size:26px;font-weight:600;color:var(--white);
    margin-bottom:6px;line-height:1.2;
  }
  .tp-category{font-size:11px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
  .tp-price-row{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
  .price-sale{font-size:22px;font-weight:600;color:var(--gold)}
  .price-original{font-size:14px;color:var(--muted2);text-decoration:line-through}
  .price-only{font-size:22px;font-weight:600;color:var(--gold)}

    font-size:10px;font-weight:600;letter-spacing:1.5px;
    background:var(--gold);color:#0a0a0a;
    padding:3px 8px;text-transform:uppercase;align-self:center;
  }
  .tp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .tag{
    font-size:10px;letter-spacing:1px;text-transform:uppercase;
    padding:4px 12px;border:1px solid var(--border);
    color:var(--muted);background:transparent;
  }
  body.lang-ar .tag{letter-spacing:0;font-size:11px}
  .tp-because{

  }

  .cta-section{display:flex;flex-direction:column;gap:10px}

  /* SECTION LABEL */
  .section-label{
    font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--muted2);margin:28px 0 12px;
    padding-bottom:10px;border-bottom:1px solid var(--border);
  }
  body.lang-ar .section-label{letter-spacing:0;font-size:12px;font-family:'Tajawal',sans-serif}

  .prod-card{
    background:var(--card2);border:1px solid var(--border);

    transition:border-color .15s;
  }

  .prod-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

  .prod-card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .prod-card-match{font-size:12px;color:var(--ok);margin-top:8px;letter-spacing:.3px}
  .prod-card-detail{display:none;margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
  .prod-card-detail.open{display:block}
  .prod-card-detail-desc{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:14px;font-weight:300}
  body.lang-ar .prod-card-detail-desc{font-size:14px}

  .btn-wa{
    background:#25D366;color:#fff;border:0;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:13px;letter-spacing:1px;
  }
  .btn-wa:hover{background:#1ebe5c}
  .btn-wa svg{flex-shrink:0}

  /* FORM */
  .form-title{
    font-family:'Cormorant Garamond',serif;
    font-size:24px;font-weight:600;color:var(--white);margin-bottom:8px;
  }
  .form-sub{font-size:13px;color:var(--muted);margin-bottom:26px;line-height:1.8;font-weight:300}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .field input{
    width:100%;font-family:'Jost',inherit;font-size:14px;
    padding:12px 16px;border:1px solid var(--border);
    background:var(--card2);color:var(--ink);
    transition:border-color .15s;
  }
  .field input:focus{outline:none;border-color:var(--gold)}
  .msg{font-size:13px;padding:10px 14px;margin-bottom:14px;display:none}
  .msg.err{display:block;background:rgba(192,57,43,.12);color:#e74c3c;border:1px solid rgba(192,57,43,.3)}
  .msg.ok{display:block;background:rgba(76,175,130,.1);color:var(--ok);border:1px solid rgba(76,175,130,.3)}

  /* FOOTER */
  .site-footer{
    background:var(--card);border-top:1px solid var(--border);
    text-align:center;padding:24px 20px;
    font-size:11px;color:var(--muted2);margin-top:56px;
    letter-spacing:.5px;
  }
  .site-footer a{color:var(--muted);text-decoration:none}
  .site-footer a:hover{color:var(--gold)}
  body.lang-ar .site-footer{letter-spacing:0;font-family:'Tajawal',sans-serif;font-size:13px}
</style>
</head>

/* ===== LANGUAGE DETECTION & STATE ===== */
const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
let currentLang = browserLang.startsWith('ar') ? 'ar' : 'en';

function L(){ return LANG[currentLang]; }

function applyLang(){
  const html = document.getElementById('html-root');
  const body = document.body;
  const l = L();
  if(currentLang === 'ar'){
    html.setAttribute('lang','ar');
    html.setAttribute('dir','rtl');
    body.classList.add('lang-ar');
  } else {
    html.setAttribute('lang','en');
    html.setAttribute('dir','ltr');
    body.classList.remove('lang-ar');
  }
  // Update lang button label
  if(currentLang === 'ar'){
    document.getElementById('lang-label').innerHTML = '<span class="active-lang">AR</span> | EN';
  } else {
    document.getElementById('lang-label').innerHTML = 'EN | <span class="active-lang">AR</span>';
  }
  // Update breadcrumb
  document.getElementById('bread-home').textContent = l.breadHome;
  document.getElementById('bread-advisor').textContent = l.breadAdvisor;
  // Update footer
  document.getElementById('footer-built').textContent = l.footerBuilt;
  document.getElementById('footer-advisor').textContent = l.breadAdvisor;
  // Re-render current screen
  if(state.phase === 'hero') renderHero();
  else if(state.phase === 'question') renderQuestion();
  else if(state.phase === 'result') renderResult();
}

function toggleLang(){
  currentLang = currentLang === 'en' ? 'ar' : 'en';
  applyLang();
}

/* ===== SCORING ===== */
function scoreProduct(pid, a){
  const p = P[pid];
  let s = 0;

  /* q1 — usage type */
  if(a.q1 === "home"){
    s += p.usage === "burn" ? 35 : 0;
  } else if(a.q1 === "gift"){
    s += (p.category === "Gift Set") ? 40 : (p.usage === "wear" ? 25 : 5);
  } else {
    s += p.usage === "wear" ? 35 : 0;
  }

  /* q4 — scent family (30pts max) */
  const fm = {
    warm:  {oud_pure:30,oud_leather:28,tobacco_smoky:26,oud_sweet:22,musk_animalic:20,oud_incense:20,oud_sweet_woody:16,floral_rose_oud:12,musky_floral:8,fresh_musky:4,floral_rose:4,oud_smoky_oriental:20},
    smoky: {tobacco_smoky:30,oud_leather:28,musk_animalic:24,oud_pure:18,oud_incense:16,oud_sweet:12,oud_sweet_woody:10,floral_rose_oud:6,musky_floral:4,fresh_musky:2,floral_rose:2,oud_smoky_oriental:28},
    fresh: {fresh_musky:30,musky_floral:18,floral_rose:14,oud_sweet_woody:10,oud_pure:6,oud_sweet:4,oud_leather:2,tobacco_smoky:2,musk_animalic:6,oud_incense:4,floral_rose_oud:10,oud_smoky_oriental:2},
    floral:{floral_rose:30,floral_rose_oud:28,musky_floral:22,fresh_musky:14,oud_sweet:12,oud_pure:6,oud_leather:4,tobacco_smoky:2,musk_animalic:4,oud_incense:4,oud_sweet_woody:8,oud_smoky_oriental:4},
    sweet: {oud_sweet:30,musky_floral:26,floral_rose:18,oud_sweet_woody:26,fresh_musky:12,musk_animalic:16,oud_pure:10,oud_leather:6,tobacco_smoky:8,oud_incense:6,floral_rose_oud:14,oud_smoky_oriental:10}
  };
  s += ((fm[a.q4]||{})[p.family]||0);

  /* q3 — intensity (15pts) */
  const im = {strong:3,moderate:2,quiet:1};
  const diff = Math.abs(p.intensity-(im[a.q3]||2));
  s += diff===0?15:diff===1?8:2;

  /* q2 — occasion (12pts) */
  const om = {daily:["daily","home"],events:["events","evening","gift"],both:["daily","events","home","gift","evening"]};
  s += (om[a.q2]||[]).some(o=>p.occasions.includes(o))?12:0;

  /* q6 — budget (8pts) — eco<$450, mid $450-$750, high>$750, luxury treated as high */
  const effectiveTier = p.tier === "luxury" ? "high" : p.tier;
  const bm = {eco:{eco:8,mid:4,high:0},mid:{eco:4,mid:8,high:2},high:{eco:2,mid:4,high:8}};
  s += ((bm[a.q6]||{})[effectiveTier]||4);

  /* q5 — oud affinity (bonus) */
  if(a.q5==="lover" && (p.family==="oud_pure"||p.family==="oud_leather"||p.family==="oud_smoky_oriental")) s+=5;
  if(a.q5==="light" && (p.family==="fresh_musky"||p.family==="floral_rose")) s+=5;
  if(a.q5==="moderate" && (p.family==="oud_sweet"||p.family==="musky_floral"||p.family==="oud_sweet_woody"||p.family==="oud_smoky_oriental")) s+=5;
  if(a.q5==="oil" && p.category==="Oud Oil") s+=8;
  if(a.q5==="musk" && p.family==="musk_animalic") s+=10;

  return s;
}

function rankProducts(a){
  return Object.keys(P).map(id=>({id,score:scoreProduct(id,a)})).sort((a,b)=>b.score-a.score);
}

function matchReason(pid, a){
  const p = P[pid];
  const l = L();
  const r = [];
  if(a.q1==="home" && p.usage==="burn") r.push(l.matchReason_home);
  if(a.q1==="gift" && p.category==="Gift Set") r.push(l.matchReason_gift);
  if(a.q1!=="home" && p.usage==="wear" && a.q1!=="gift") r.push(l.matchReason_wear);
  const fl = l.families;
  if(fl[p.family]) r.push(fl[p.family]);
  const il = l.intensities;
  if(il[p.intensity]) r.push(il[p.intensity]);
  return r.slice(0,2).join(" · ");
}

/* ===== ENGINE ===== */
const state = {i:0, answers:{}, ranked:[], phase:'hero'};
const screen = document.getElementById("screen");
const bar = document.getElementById("bar");

function setBar(s){ bar.style.width = Math.round((s/QUESTIONS.length)*100)+"%" }

function pName(p){ return currentLang==='ar' ? p.nAr : p.n; }
function pDesc(p){ return currentLang==='ar' ? p.descAr : p.desc; }

function renderHero(){
  state.phase = 'hero';
  setBar(0);
  const l = L();
  screen.innerHTML=`
    <span class="hero-eyebrow">${l.heroEyebrow}</span>
    <h1>${l.heroTitle}</h1>
    <p class="sub">${l.heroSub}</p>
    <div class="divider"></div>
    <button class="btn btn-primary" id="start">${l.startBtn}</button>`;
  document.getElementById("start").onclick=()=>{state.i=0;state.answers={};renderQuestion()};
}

function renderQuestion(){
  state.phase = 'question';
  const q = QUESTIONS[state.i];
  const l = L();
  setBar(state.i+1);
  const qText = currentLang==='ar' ? q.textAr : q.text;
  screen.innerHTML=`
    <div class="q-step">${l.questionLabel} ${state.i+1} ${l.of} ${QUESTIONS.length}</div>
    <div class="q-text">${qText}</div>
    <div class="opts" id="opts"></div>
    ${state.i>0?`<div class="back-row"><button class="btn btn-ghost" id="back" style="width:auto;padding:11px 32px">${l.backBtn}</button></div>`:''}`;
  const wrap = document.getElementById("opts");
  q.opts.forEach(o=>{
    const b = document.createElement("button");
    b.className = "opt";
    const optLabel = currentLang==='ar' ? o.labelAr : o.label;
    b.innerHTML = `<span class="dot"></span><span>${optLabel}</span>`;
    b.onclick = ()=>{
      state.answers[q.id] = o.id;
      if(state.i < QUESTIONS.length-1){ state.i++; renderQuestion(); }
      else{ state.ranked = rankProducts(state.answers); renderResult(); }
    };
    wrap.appendChild(b);
  });
  const back = document.getElementById("back");
  if(back) back.onclick = ()=>{ state.i--; renderQuestion(); };
}

function renderResult(){
  state.phase = 'result';
  setBar(QUESTIONS.length);
  const l = L();
  const ranked = state.ranked;
  const topId = ranked[0].id;
  const top = P[topId];
  const topSale = parseFloat(top.sale);
  const topWas = top.was ? parseFloat(top.was) : null;
  const topPriceHtml = topWas
    ? `<span class="price-sale">AED ${top.sale}</span><span class="price-original">AED ${top.was}</span><span class="price-sale-badge">${l.saleLabel}</span>`
    : `<span class="price-only">AED ${top.sale}</span>`;

  function altCard(rank){
    const item = ranked[rank];
    if(!item) return '';
    const pd = P[item.id];
    const reason = matchReason(item.id, state.answers);
    const priceStr = pd.was
      ? `AED ${pd.sale} <span class="was">${l.wasLabel} AED ${pd.was}</span>`
      : `AED ${pd.sale}`;
    const tagsHtml = pd.tags.map(t=>`<span class="tag">${t}</span>`).join("");
    const name = pName(pd);
    const desc = pDesc(pd);
    return `<div class="prod-card" onclick="toggleCard(this)">
      <div class="prod-card-head">
        <div>
          <div class="prod-card-name">${name}</div>
          <div style="font-size:10px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px">${pd.category}</div>
        </div>
        <div class="prod-card-price">${priceStr}</div>
      </div>
      <div class="prod-card-tags">${tagsHtml}</div>
      ${reason ? `<div class="prod-card-match">✦ ${reason}</div>` : ""}
      <div class="expand-hint">${l.tapExpand}</div>
      <div class="prod-card-detail">
        <div class="prod-card-detail-desc">${desc}</div>
        <a class="btn btn-outline" href="${pd.url}" target="_blank" rel="noopener" style="font-size:11px;padding:11px 24px">${l.viewProduct}</a>
      </div>
    </div>`;
  }

  function remainingCards(){
    return ranked.slice(3).map(item=>{
      const pd = P[item.id];
      const priceStr = pd.was
        ? `AED ${pd.sale} <span class="was">${l.wasLabel} AED ${pd.was}</span>`
        : `AED ${pd.sale}`;
      const tagsHtml = pd.tags.map(t=>`<span class="tag">${t}</span>`).join("");
      const name = pName(pd);
      const desc = pDesc(pd);
      return `<div class="prod-card" onclick="toggleCard(this)">
        <div class="prod-card-head">
          <div>
            <div class="prod-card-name">${name}</div>
            <div style="font-size:10px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px">${pd.category}</div>
          </div>
          <div class="prod-card-price">${priceStr}</div>
        </div>
        <div class="prod-card-tags">${tagsHtml}</div>
        <div class="expand-hint">${l.tapExpand}</div>
        <div class="prod-card-detail">
          <div class="prod-card-detail-desc">${desc}</div>
          <a class="btn btn-outline" href="${pd.url}" target="_blank" rel="noopener" style="font-size:11px;padding:11px 24px">${l.viewProduct}</a>
        </div>
      </div>`;
    }).join("");
  }

  const waMsg = encodeURIComponent(
    currentLang==='ar'
      ? `مرحباً، أنا مهتم بـ ${pName(top)} من Oud Factory. هل يمكنكم مساعدتي؟`
      : `Hi, I'm interested in ${top.n} from Oud Factory. Can you help me?`
  );
  const waUrl = `https://wa.me/971568788399?text=${waMsg}`;

  screen.innerHTML=`
    <div class="result-header">
      <h2>${l.resultTitle}</h2>
      <p>${l.resultSub}</p>
    </div>
    <div class="top-pick">
      <span class="top-pick-label">${l.topMatchLabel}</span>
      <div class="top-pick-body">
        <div class="tp-name">${pName(top)}</div>
        <div class="tp-category">${top.category}</div>
        <div class="tp-price-row">${topPriceHtml}</div>
        <div class="tp-tags">${top.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
        <div class="tp-because">${pDesc(top)}</div>
        <div class="cta-section">
          <a class="btn btn-primary" href="${top.url}" target="_blank" rel="noopener">${l.shopBtn}</a>
          <a class="btn btn-wa" href="${waUrl}" target="_blank" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            ${l.whatsappBtn}
          </a>
        </div>
      </div>
    </div>
    <div class="section-label">${l.alternativesLabel}</div>
    ${altCard(1)}${altCard(2)}
    <div class="section-label">${l.allLabel}</div>
    ${remainingCards()}
    <div class="divider"></div>
    <button class="btn btn-ghost" id="restart">${l.retakeBtn}</button>`;

  document.getElementById("restart").onclick=()=>{ state.answers={}; state.i=0; renderHero(); };
}

function toggleCard(el){
  const d = el.querySelector(".prod-card-detail");
  if(d) d.classList.toggle("open");
}

/* ===== INIT ===== */
state.phase = 'hero';
applyLang(); // applyLang detects phase and calls renderHero()
</script>
</body>
</html>
